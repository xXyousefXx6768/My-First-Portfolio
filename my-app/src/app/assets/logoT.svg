<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- ظل سينمائي خفي وخافت جداً يعطي إيحاءً بأن الحرف يطفو فوق واجهة الموقع -->
    <filter id="tesla-awwwards-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#f25f00" flood-opacity="0.2"/>
    </filter>

    <!-- التدرج البرتقالي الأيقوني الخاص بموقعك -->
    <linearGradient id="tesla-solid-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" /> <!-- النور العلوي -->
      <stop offset="50%" stop-color="#f25f00" /> <!-- اللون الرئيسي لموقعك -->
      <stop offset="100%" stop-color="#731d00" /> <!-- العمق السفلي الفاخر -->
    </linearGradient>
  </defs>

  <!-- الشعار مقسم لكتلتين نقيتين تماماً بستايل تيسلا المعماري الفاخر -->
  <g filter="url(#tesla-awwwards-shadow)" fill="url(#tesla-solid-orange)">
    
    <!-- 1. الزائدة العلوية (الجناح الطائر المنفصل تماماً بستايل تيسلا - كتلة مصمتة) -->
    <path d="M 80,130 
             Q 300,75 520,130 
             Q 300,110 80,130 Z" />
    
    <!-- 2. جسم حرف T السفلي (كتلة مصمتة ونقية تماماً متناسقة مع انحناء الجناح) -->
    <path d="M 100,170 
             Q 300,215 500,170 
             L 450,225 
             Q 350,250 350,260 
             L 350,470 
             Q 350,500 320,500 
             L 280,500 
             Q 250,500 250,470 
             L 250,260 
             Q 250,250 150,225 
             Z" />
  </g>
</svg>
